name: Build dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 \
            https://github.com/theos/theos.git \
            $HOME/theos

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          git clone --depth=1 \
            https://github.com/theos/sdks.git \
            /tmp/sdks

          mkdir -p "$HOME/theos/sdks"

          find /tmp/sdks -maxdepth 1 -type d -name "*.sdk" \
            -exec cp -R {} "$HOME/theos/sdks/" \;

      - name: Show project files
        run: |
          echo "===== Project ====="
          ls -la

          echo "===== Makefile ====="
          cat Makefile

      - name: Build
        run: |
          export THEOS="$HOME/theos"

          make clean || true
          make package FINALPACKAGE=1

      - name: Show build result
        run: |
          echo "===== Packages ====="
          find . -type f -name "*.deb" -print

          echo "===== dylib ====="
          find . -type f -name "*.dylib" -print

      - name: Prepare dylib
        run: |
          mkdir -p release

          find . \
            -type f \
            -name "infinitokfix.dylib" \
            -not -path "./release/*" \
            -exec cp {} release/ \;

          if [ ! -f release/infinitokfix.dylib ]; then
            echo "ERROR: infinitokfix.dylib not found"
            exit 1
          fi

          cd release

          zip -9 infinitokfix.zip infinitokfix.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: infinitokfix-dylib
          path: release/infinitokfix.zip
          if-no-files-found: error

      - name: Upload raw dylib
        uses: actions/upload-artifact@v4
        with:
          name: infinitokfix-dylib-raw
          path: release/infinitokfix.dylib
          if-no-files-found: error

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: infinitokfix-deb
          path: packages/*.deb
          if-no-files-found: warn